proxy_cache_path /var/cache/nginx/gbfs levels=1:2 keys_zone=gbfs_cache:10m max_size=100m inactive=10m use_temp_path=off;

map $http_accept_language $preferred_lang {
    default en;

    ~*^it it;
    ~*^fr fr;
    ~*^de de;
    ~*^es es;
    ~*^ja ja;
    ~*^zh zh;
    ~*^en en;
}

server {
    listen 80;
    server_name smart-mobility.homelinuxserver.org;

    root /usr/share/nginx/html;
    index index.html;

    resolver 1.1.1.1 8.8.8.8 valid=60s;
    resolver_timeout 5s;

    # Redirect root to detected language
    location = / {
        return 308 /$preferred_lang/;
    }

    # Proxy GBFS feeds to avoid CORS issues
    location ~ ^/gbfs/dott/(.*)$ {
        set $dott_upstream gbfs.api.ridedott.com;
        proxy_ssl_server_name on;
        proxy_set_header Host $dott_upstream;
        proxy_pass https://$dott_upstream/public/v2/$1$is_args$args;

        proxy_cache gbfs_cache;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_valid 200 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~ ^/gbfs/bird/(.*)$ {
        set $bird_upstream mds.bird.co;
        proxy_ssl_server_name on;
        proxy_set_header Host $bird_upstream;
        proxy_pass https://$bird_upstream/gbfs/v2/public/$1$is_args$args;

        proxy_cache gbfs_cache;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_valid 200 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~ ^/gbfs/lime/(.*)$ {
        set $lime_upstream data.lime.bike;
        proxy_ssl_server_name on;
        proxy_set_header Host $lime_upstream;
        proxy_pass https://$lime_upstream/api/partners/v2/gbfs/$1$is_args$args;

        proxy_cache gbfs_cache;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_valid 200 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Serve localized Angular builds
    location ~ ^/(it|en|fr|de|es|ja|zh)/ {
        try_files $uri $uri/ /$1/index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|json)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
